name: Bug report
description: Report a problem with Kenace's Entity Counter
title: "[Bug]: "
body:
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: "26.1.2"
    validations:
      required: true
  - type: input
    id: mod
    attributes:
      label: Mod version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
      description: List the steps to trigger the problem.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or crash log
      description: Add helpful screenshots, log details, or the latest.log file.
    validations:
      required: false
